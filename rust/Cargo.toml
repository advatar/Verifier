[workspace]
resolver = "3"
members = ["verifier-core", "hybrid-pq", "hybrid-pq-verifier"]

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

